<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Ryu" />
        <link rel="icon" href="./assets/logo.png" />
        <title>V-Chitra</title>
        <link rel="stylesheet" href="./styles/main.css">
    </head>
    <body>
        <header>
            <div id="headGrid">
                <a href="./index.html"><img src="./assets/logo.png" id="headerlogo"/></a>
                <div class="toolbar">
                    <p class="tool" id="pointer" style="background: #a1a1a1;">pointer</p>
                    <p class="tool" id="brush">brush</p>
                    <p class="tool" id="line">line</p>
                    <p class="tool" id="square">square</p>
                    <p class="tool" id="rect">rectangle</p>
                    <p class="tool" id="circle">circle</p>
                    <p class="tool" id="tri">triangle</p>
                    <p class="tool" id="text">textbox</p>
                    <p class="tool" id="undo">undo</p>
                </div>
                <div class="lineColorWidth">
                    <input type="color" id="color" value="black">
                    <div class="lineWidth">
                        <input type="range" min="1" max="16" value="1" id="lineWidthSlider">
                        <p id="displayLineWidth">1</p>
                    </div>
                </div>
            </div>
        </header>
        <div class="canvasArea">
            <canvas id="drawCanvas">
            </canvas>
        </div>
    </body>
    <script src="./scripts/main.js" defer></script>
</html>
