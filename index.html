<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Ryu" />
        <link rel="icon" href="./assets/logo.png" />
        <title>V-Chitra</title>
        <link rel="stylesheet" href="./styles/main.css">
    </head>
    <body>
        <header>
            <div id="headGrid">
                <a href="./index.html"><img src="./assets/logo.png" id="headerlogo"/></a>
                <div class="toolbar">
                    <p class="tool" id="pointer" style="background: #a1a1a1;">pointer</p>
                    <p class="tool" id="brush">brush</p>
                    <p class="tool" id="line">line</p>
                    <p class="tool" id="square">square</p>
                    <p class="tool" id="rect">rectangle</p>
                    <p class="tool" id="circle">circle</p>
                    <p class="tool" id="tri">triangle</p>
                    <p class="tool" id="text">textbox</p>
                    <p class="tool" id="undo">undo</p>
                </div>
            </div>

        </header>
        <div class="canvasArea">

            <canvas id="drawCanvas">
                
            </canvas>
            <div class="colorSelectorPanel">
                <div class="colorGrid">
                    <p class="color" id="red" style="background: red;">‎</p>
                    <p class="color" id="orange" style="background: orange;">‎</p>
                    <p class="color" id="yellow" style="background: yellow;"‎></p>
                    <p class="color" id="green" style="background: green;">‎</p>
                    <p class="color" id="cyan" style="background: cyan;">‎</p>
                    <p class="color" id="blue" style="background: blue;">‎</p>
                    <p class="color" id="voilet" style="background: violet;">‎</p>
                    <p class="color" id="white" style="background: white;">‎</p>
                    <p class="color" id="black" style="background: black; border : 0.15rem solid white;">‎</p>
                </div>
                <!-- <input> -->
                <div class="lineWidth">
                    <input type="range" min="1" max="16" value="1" id="lineWidthSlider">
                    <p id="displayLineWidth">1</p>
                </div>

            </div>
        </div>

        
    </body>
    <script src="./scripts/main.js" defer></script>
</html>
